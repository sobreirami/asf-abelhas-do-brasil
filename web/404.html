<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Abra no app — Abelhas do Brasil</title>
  <meta name="description" content="Baixe o app Abelhas do Brasil para ver esta espécie." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐝</text></svg>" />
  <link rel="stylesheet" href="/styles.css" />
  <style>
    body { display: flex; flex-direction: column; min-height: 100vh; }
    .open-page {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 48px 24px;
      gap: 24px;
    }
    .open-icon { font-size: 72px; line-height: 1; }
    .open-page h1 { font-size: clamp(24px, 5vw, 36px); font-weight: 800; color: var(--text); letter-spacing: -0.02em; }
    .open-page p { font-size: 17px; color: var(--text-muted); max-width: 400px; line-height: 1.6; }
    .open-actions { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin-top: 8px; }
    .divider { font-size: 13px; color: var(--text-muted); }
  </style>
</head>
<body>
  <nav class="nav">
    <div class="container nav-inner">
      <a class="nav-brand" href="/">
        <span class="bee">🐝</span>
        Abelhas do Brasil
      </a>
    </div>
  </nav>

  <main class="open-page">
    <div class="open-icon">🐝</div>
    <h1>Abra no app</h1>
    <p>
      Baixe o <strong>Abelhas do Brasil</strong> para ver o perfil completo desta espécie
      — fotos, descrição, bioma, status de conservação e muito mais.
    </p>
    <div class="open-actions">
      <a class="btn btn-store" href="#" aria-label="Baixar na App Store">
        <svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98l-.09.06c-.22.15-2.18 1.27-2.16 3.8.03 3.02 2.65 4.03 2.68 4.04l-.07.28zM13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/></svg>
        App Store
      </a>
      <a class="btn btn-store" href="#" aria-label="Baixar no Google Play">
        <svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20"><path d="M3.18 23.76c.3.17.64.24.99.2l12.5-7.22-2.83-2.83-10.66 9.85zm-1.9-20.2A1.98 1.98 0 0 0 1 4.9v14.2c0 .57.22 1.1.63 1.48l.08.07 7.95-7.95v-.19L1.28 4.56zm19.16 8.7L17.8 9.91l-3.1 3.1 3.1 3.1 2.67-1.54a2 2 0 0 0 0-3.41zM4.17.24l12.5 7.22-2.83 2.83L3.18.44a1.3 1.3 0 0 1 .99-.2z"/></svg>
        Google Play
      </a>
    </div>
    <span class="divider">ou</span>
    <a class="btn btn-ghost" href="/">Ver a página do projeto</a>
  </main>

  <footer class="footer">
    <div class="container footer-inner">
      <div class="footer-brand"><span class="bee">🐝</span> Abelhas do Brasil</div>
      <div class="footer-divider"></div>
      <p class="footer-copy">© 2026 Abelhas do Brasil · Projeto open source</p>
    </div>
  </footer>
</body>
</html>
