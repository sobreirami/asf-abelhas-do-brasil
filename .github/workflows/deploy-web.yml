name: Deploy landing page

on:
  push:
    branches: [main]
    paths:
      - 'web/**'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web
          cname: asfabelhasdobrasil.com.br
          # Garante que .well-known/ seja copiado (arquivos sem extensão)
          enable_jekyll: false
